  - id: treescape-color-by-continuous-determinism
    title: Continuous metadata coloring produces byte-identical SVG for fixed inputs
    case: cases/treescape.md
    source: packages/treescape
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#property-based-testing
    claim: >
      `TreePlot.color_tips_by(column, cmap=...)` and
      `TreePlot.color_branches_by(column, cmap=...)` produce byte-identical
      SVG across repeated renders given the same column values, the same
      `cmap`, and the same `(vmin, vmax)` range. Default `cmap` is
      `"viridis"`, mapped through treescape's pinned 11-keystop LUT
      (documented in docs/conventions.md, v0.3 continuous color); endpoints
      are `#440154` at t=0 and `#fde725` at t=1. Callable `cmap` arguments
      are honored. Branch coloring uses the **mean** of descendant tips'
      non-missing values; subtrees with no observed values keep the
      default branch color silently — no warning, since "no data" is not
      a paraphyletic miscoloring. Degenerate ranges (`vmin == vmax`, or
      all values equal) deterministically map to the colormap midpoint
      (`t = 0.5`) rather than dividing by zero. v0.4 Phase 1 extends
      coverage to circular layouts: continuous tip and branch coloring
      apply to per-Text fill and the radial parent→child Line stroke
      respectively (per docs/conventions.md, v0.4 Phase 1), with the
      same byte-determinism property.
    subsystem: style
    inputs:
      corpus: "tests/oracle/test_color_by_continuous.py"
      n: 12
      class: synthetic
    pinned_versions:
      treescape: "0.5.0"
      self-consistency: "0.5.0"
    tolerances:
      - metric: mismatch_count
        op: "=="
        value: 0
        prose: "Exact byte equality across repeated renders for fixed inputs."
    evidence:
      oracle:
        - self-consistency
      command: pytest tests/oracle/test_color_by_continuous.py -v
      artifact: tests/oracle/reports/color_by_continuous.json
    assumptions:
      - The viridis LUT shipped in `packages/treescape/src/treescape/plot.py`
        is the convention owner. Visual fidelity to matplotlib's full
        256-stop viridis is approximate; byte-determinism is exact.
      - The vmin/vmax kwargs default to the column's observed min/max
        across the tree's tip universe — so branch and tip colorings
        share the same scale by construction when both call color_*_by
        on the same column without explicit pins.
      - Auto-detection of numeric vs discrete dispatch reads
        isinstance(v, (int, float)) on observed values (excluding
        bool); pl.read_csv typically produces float for numeric
        columns, which routes correctly.
    failure_modes:
      - User passes a callable `cmap` whose output is locale-dependent or
        otherwise non-deterministic; this would rightly fail the claim.
      - Auto-detection misclassifies a column whose values are all
        numeric strings (e.g., `"0.85"`); user fixes by casting before
        the join, or by passing `cmap=` / `palette=` explicitly.
      - The pinned LUT changes between treescape versions, breaking
        byte-determinism across version bumps. Documented and accepted
        — golden bytes regen on a LUT change.

  - id: treescape-branch-width-by-numeric-determinism
    title: Numeric metadata branch widths produce byte-identical SVG for fixed inputs
    case: cases/treescape.md
    source: packages/treescape
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#property-based-testing
    claim: >
      `TreePlot.width_branches_by(column, wmin=, wmax=, vmin=, vmax=)`
      maps a numeric metadata column through a linear interpolation onto
      `[wmin, wmax]` over `[vmin, vmax]`, producing byte-identical SVG
      across repeated renders for the same column values, the same
      `(wmin, wmax)`, and the same `(vmin, vmax)` range. Internal
      branches use the **mean** of descendant tips' non-missing values;
      terminal branches use the tip's own value (subtree of one).
      Subtrees with no observed values keep the default stroke_width
      silently — no warning, since "no data" is not a paraphyletic
      miscoloring (matches the convention treescape-color-by-continuous-determinism
      uses for the color path). Degenerate ranges (`vmin == vmax`, or
      all values equal) deterministically map to width
      `(wmin + wmax) / 2`. Out-of-range values are clamped, not
      extrapolated. The method raises ValueError if any observed value
      fails to coerce to numeric — width-by-discrete is out of v0.4
      scope.
    subsystem: style
    inputs:
      corpus: "tests/oracle/test_branch_width_by_metadata.py"
      n: 16
      class: synthetic
    pinned_versions:
      treescape: "0.5.0"
      self-consistency: "0.5.0"
    tolerances:
      - metric: mismatch_count
        op: "=="
        value: 0
        prose: "Exact byte equality across repeated renders for fixed inputs."
    evidence:
      oracle:
        - self-consistency
      command: pytest tests/oracle/test_branch_width_by_metadata.py -v
      artifact: tests/oracle/reports/branch_width_by_metadata.json
    assumptions:
      - The (wmin, wmax) defaults of (1.0, 4.0) match
        SceneOptions.stroke_width's default at the lower bound, so a
        "minimum" width branch reads visually identical to an unstyled
        branch. User overrides are honored; no clamping of (wmin, wmax)
        ranges.
      - The vmin/vmax defaults take the column's observed min/max
        across the tree's tip universe — so width and color share the
        same scale by construction when both methods are applied to
        the same column without explicit pins.
      - Numeric-only dispatch reads isinstance(v, (int, float))
        excluding bool. Strings that happen to look numeric are not
        auto-coerced; the user must cast before the join or use the
        width path with a pre-converted column.
    failure_modes:
      - User specifies wmin > wmax. Documented and accepted as a
        deliberate "invert the scale" knob; no validation reorders.
        Resulting widths interpolate "backwards" but remain
        deterministic.
      - A terminal branch's tip value is missing while sibling
        terminals have values. The missing-value branch keeps default
        stroke_width; siblings get their interpolated widths. No
        warning (matches the color-continuous convention).
      - User passes an integer column where wmin/wmax produce widths
        that round to identical values at the SVG float-formatter's
        precision; the goldens still differ on coordinate floats but
        a careless test could miss the width difference. The oracle
        checks specific stroke-width fragments to avoid this.

