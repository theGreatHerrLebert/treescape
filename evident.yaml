      - Julia is found via `TREESCAPE_JULIA` or `julia` on PATH, and the
        C-ABI library via `TREESCAPE_JL_LIB` or the development build.
        When either is missing the runner skips with that reason; the
        CI `julia` job provides both, so the claim does not pass by
        skipping there.
      - Callable colormaps cannot be expressed in the data-only case
        file; the Julia test suite checks them separately.
    failure_modes:
      - A host-side rule (source heuristic, options mapping, color
        parsing, alpha rounding, dtype detection, label formatting)
        drifts between plot.py and Treescape.jl on an input the case
        file does not exercise. Mitigated by listing every mirrored
        rule in docs/conventions.md (v0.5 Phase 2) and covering each
        with at least one case.
      - Error-path parity is not claimed. Julia rejects some malformed
        color strings Python's int(x, 16) accepts (documented).

  - id: treescape-jl-ffi-no-abort
    title: Malformed input through the C ABI returns a status, never aborts Julia
    case: cases/treescape.md
    source: treescape-jl-connector
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#property-based-testing
    claim: >
      Driven through Treescape.jl's raw ccall layer in a single Julia
      subprocess, no `ts_*` entry point panics or aborts: the process
      survives every case. Two kinds of case are checked. Required-error
      cases — null pointers, invalid UTF-8, out-of-range node and tip
      ids, short or oversized buffers, column-length mismatches, a
      misaligned or null out/options pointer, NaN through viridis, an
      exhausted palette, a whole-tree circular highlight, a stray `]` in
      Newick — must return their specific non-zero status. Survival-only
      cases — seeded random byte strings and mutations of a valid tree
      (parsed and, when they parse, rendered in both layouts), NaN and
      infinite option, width and scale-bar values, unknown highlight
      tips — may succeed or fail; if they fail, the status must carry a
      message. Because the release profile uses `panic = "abort"`, any
      panic kills the process, which the runner reports as a failure
      naming the last case started.
    subsystem: ffi
    inputs:
      corpus: "packages/Treescape.jl/test/ffi_no_abort.jl"
      n: 1611
      class: synthetic
    pinned_versions:
      treescape: "0.5.0"
      julia-subprocess: "Julia 1.10 and 1.12"
    tolerances:
      - metric: pass_rate
        op: "=="
        value: 1.0
        prose: "Exact: the process exits cleanly; every required-error case returns its expected status; every non-zero status has a message."
    evidence:
      oracle:
        - julia-subprocess
      command: pytest tests/oracle/test_jl_ffi_no_abort.py -v
      artifact: tests/oracle/reports/jl_ffi_no_abort.json
    assumptions:
      - Same Julia and library discovery as treescape-julia-python-svg-parity,
        with the same skip-with-reason (or fail under
        TREESCAPE_REQUIRE_JULIA=1) behavior.
      - Memory-safety errors that no check can detect (a dangling or
        freed handle, a buffer shorter than its stated length) are
        outside this claim; Treescape.jl never exposes raw handles.
    failure_modes:
      - A panic on a path the case list does not reach. Mitigated by
        the crate-level clippy deny-list (unwrap/expect/panic/
        indexing) on the connector and by Miri over the in-process tests.

  - id: treescape-tree-build-rust-vs-reference
    title: Rust NJ and UPGMA build the same trees as the Python reference, ties included
    case: cases/treescape.md
    source: treescape-core
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#reference-shadowing
    claim: >
      For every matrix in the distance-v1 corpus (additive and noisy
      matrices derived from pinned random trees) and in the
      distance-ties corpus (hand-written matrices where several pairs
      share the minimum), the Rust tree builders in treescape-core
      (neighbor joining and UPGMA, via treescape_connector) produce the
      same rooted tree as treescape_reference.tree_build: identical
      topology including child order, identical tip names, and branch
      lengths within 1e-12 absolute. Because the conventions pin the
      tie rule and the floating-point order, this includes every tie.
      This is Rust<->Python parity, not correctness; correctness comes
      from the oracle claims.
    subsystem: tree-building
    inputs:
      corpus: "distance-all"
      n: 75
      classes: [synthetic, fixture]
      corpus_sha: "sha256:af4a1450b6053c2b4d70c292ffade228debc236eb81a1e66955bd59157b22703"
    pinned_versions:
      treescape: "0.5.0"
      treescape-reference: "0.5.0"
    tolerances:
      - metric: mismatch_count
        op: "=="
        value: 0
        prose: "Topology (with child order) and tip names identical."
      - metric: absolute_error
        op: "<"
        value: 1.0e-12
        prose: "1e-12 absolute on every branch length."
    evidence:
      oracle:
        - treescape-reference
      command: pytest tests/oracle/test_tree_build_vs_reference.py -v
      artifact: tests/oracle/reports/tree_build_vs_reference.json
    assumptions:
      - The reference is the convention owner (docs/conventions.md, "Trees
        from distance matrices"); if its conventions are wrong this claim
        still passes, hence the oracle claims.
    failure_modes:
      - Both implementations share a misreading of the algorithm (the
        Agreement Trap); the external oracles and the additive-recovery
        property are the guard.

  - id: treescape-nj-vs-oracles
    title: Neighbor joining agrees with scikit-bio and Biopython (unrooted, within 1e-9)
    case: cases/treescape.md
    source: treescape-core
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#oracle-comparison
    claim: >
      On every matrix of the distance-v1 corpus, the neighbor-joining
      trees built by both treescape implementations (the Rust core via
      treescape_connector, and treescape_reference) agree with
      scikit-bio's nj (run with neg_as_zero=False, so negative lengths
      are kept as treescape keeps them) and with Biopython's
      DistanceTreeConstructor.nj, compared as unrooted trees: the same
      set of splits exactly, and every edge length within 1e-9 absolute.
      The corpus is tie-free; the oracles break ties differently
      (docs/conventions.md), so ties are covered by the Rust<->reference
      claim, not by this one.
    subsystem: tree-building
    inputs:
      corpus: "distance-v1"
      n: 72
      class: synthetic
      corpus_sha: "sha256:b40c0736e13ad47f8d410c45e063299dfede712f3b5c30faf764caaf6ac3ef53"
    pinned_versions:
      treescape: "0.5.0"
      scikit-bio: "0.7.3"
      Biopython: "1.88"
    tolerances:
      - metric: mismatch_count
        op: "=="
        value: 0
        prose: "Unrooted topology: identical split sets."
      - metric: absolute_error
        op: "<"
        value: 1.0e-9
        prose: "1e-9 absolute on every edge length (edges matched by split; a two-child root merged into one edge)."
    evidence:
      oracle:
        - scikit-bio
        - Biopython
      command: pytest tests/oracle/test_nj_vs_oracles.py -v
      artifact: tests/oracle/reports/nj_vs_oracles.json
    assumptions:
      - scikit-bio's nj and Biopython's nj are independent implementations
        (compiled Cython vs pure Python, different bookkeeping); neither
        is derived from treescape.
      - The corpus has no exact ties in the Q criterion; the runner
        checks this and fails on a tied matrix rather than skipping it.
    failure_modes:
      - An oracle version changes its NJ variant or rooting; the version
        pins and the unrooted comparison guard against the latter.
      - Negative lengths clamped by an oracle default and the claim
        silently tolerating it; the runner passes neg_as_zero=False.

