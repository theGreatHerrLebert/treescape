version: 0.1
claims:
  - id: treescape-newick-roundtrip
    title: Newick parser round-trips and matches Biopython on canonical fixtures
    case: cases/treescape.md
    source: treescape-core
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#oracle-comparison
    claim: >
      The treescape Newick parser and writer round-trip every canonical
      fixture (parse -> write -> reparse) with exact equality on topology
      hash and branch lengths. On the small and medium fixture sets, the
      parsed tree agrees with Biopython.Phylo within 1e-9 on branch
      lengths and exactly on topology.
    evidence:
      oracle:
        - Biopython.Phylo (pinned >=1.84,<2)
        - self (round-trip)
      tolerance: >
        Round-trip: exact equality on topology hash and branch lengths.
        Biopython parity: 1e-9 absolute on branch lengths, exact on
        topology, on small/* and medium/* fixtures. Edge fixtures are
        excluded with a documented reason.
      command: pytest tests/oracle/test_newick_roundtrip.py -v
      artifact: tests/oracle/reports/newick_roundtrip.json
    assumptions:
      - Biopython parses negative branch lengths and NHX comments with
        conventions that may differ from ours; those edge fixtures are
        excluded and documented in tests/fixtures/trees/FIXTURES.md.
      - Pinned Biopython version recorded in the test environment.
    failure_modes:
      - Round-trip silently normalizes formatting, masking parser bugs.
      - Quoted names with embedded parentheses parsed as structure.
      - NHX annotations dropped on write without a warning.

  - id: treescape-layout-rust-vs-reference
    title: Rust rectangular layout agrees with the Python reference within 1e-9
    case: cases/treescape.md
    source: treescape-core
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#reference-shadowing
    claim: >
      Rectangular layout coordinates produced by treescape-core agree
      with the readable Python reference in treescape-reference within
      1e-9 absolute on every small and medium fixture. This proves
      Rust<->Python parity, NOT correctness in absolute terms; it must
      hold alongside layout-vs-ete3, layout-vs-biopython, and
      layout-vs-ggtree.
    evidence:
      oracle:
        - treescape-reference (pure-Python, this workspace)
      tolerance: 1e-9 absolute on (x, y) per node.
      command: pytest tests/oracle/test_layout_vs_reference.py -v
      artifact: tests/oracle/reports/layout_rust_vs_reference.json
    assumptions:
      - The Python reference is the canonical convention owner; if its
        conventions are wrong, this claim still passes. Hence the three
        external-oracle claims that follow.
    failure_modes:
      - Both implementations drift in lockstep because they share an
        author and a fixture set (the closest local Agreement Trap).
      - Rust impl computes correctly but FFI string handling reorders
        children, producing identical structure with permuted indices.

  - id: treescape-layout-vs-ete3
    title: Rectangular layout agrees with ete3 within 1e-6 (CSIC lineage oracle)
    case: cases/treescape.md
    source: treescape-core
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#oracle-comparison
    claim: >
      treescape rectangular layout coordinates agree with ete3's
      coordinate output within 1e-6 absolute on a curated subset of
      small and medium fixtures. Convention notes in
      docs/conventions.md document tip-spacing, internal-x, and root-x
      conventions matched or deliberately diverged.
    evidence:
      oracle:
        - ete3 (pinned)
      tolerance: 1e-6 absolute, looser to absorb ete3 internal pixel rounding.
      command: pytest tests/oracle/test_layout_vs_ete3.py -v
      artifact: tests/oracle/reports/layout_vs_ete3.json
    assumptions:
      - Ete3 coordinate output is read directly from its layout module,
        not from rendered pixel positions.
      - Pinned ete3 version recorded in the test environment.
    failure_modes:
      - Ete3 changes its tip-ordering convention in a minor release and
        we silently bump the tolerance.
      - Fixture chosen because it happens to match, hiding a systematic
        gap on harder topologies.

  - id: treescape-layout-vs-biopython
    title: Rectangular layout agrees with Biopython.Phylo within 1e-6 (Biopython lineage oracle)
    case: cases/treescape.md
    source: treescape-core
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#oracle-comparison
    claim: >
      treescape rectangular layout coordinates agree with the x/y
      positions returned by Biopython.Phylo._get_x_positions and
      _get_y_positions within 1e-6 absolute on small and medium
      fixtures. This oracle is independent of ete3 — different parser,
      different traversal, different coordinate construction.
    evidence:
      oracle:
        - Biopython.Phylo (pinned >=1.84,<2)
      tolerance: 1e-6 absolute on (x, y) per node.
      command: pytest tests/oracle/test_layout_vs_biopython.py -v
      artifact: tests/oracle/reports/layout_vs_biopython.json
    assumptions:
      - Bio.Phylo's _get_*_positions are private but stable — version pin
        records the SHA we tested against.
      - Independence from ete3 holds because the two libraries derive
        from different code lineages with no shared layout heritage.
    failure_modes:
      - Biopython's underscore-prefixed positions API breaks across a
        version bump and we paper over with a workaround instead of
        surfacing the regression.

  - id: treescape-layout-vs-ggtree
    title: Rectangular layout agrees with R/ggtree within 1e-4 (ggplot2 lineage oracle)
    case: cases/treescape.md
    source: treescape-core
    tier: release
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#oracle-comparison
    claim: >
      treescape rectangular layout coordinates agree with R ggtree's
      x/y output within 1e-4 absolute on small and edge fixtures, after
      two convention adjustments documented in docs/conventions.md: the
      oracle invokes ggtree with ladderize=FALSE (treescape does not
      ladderize implicitly), and the test applies a +1 offset to our y
      to match ggtree's 1-based tip indexing. Tier release because it
      requires R + Bioconductor; runs inside
      workflow/Dockerfile.evident-release before any release tag.
    evidence:
      oracle:
        - R 4.x + Bioconductor + ggtree (pinned)
      tolerance: >
        1e-4 absolute on (x, y) per node. Looser than ete3/Biopython
        because ggplot's internal scaling introduces float drift not
        present in the other oracles.
      command: pytest tests/oracle/test_layout_vs_ggtree.py -v -m release_only
      artifact: tests/oracle/reports/layout_vs_ggtree.json
    assumptions:
      - R + Bioconductor + ggtree are available in the release runner;
        pytest skips with a clear message otherwise.
      - workflow/scripts/oracle_ggtree.R emits a deterministic CSV of
        (node_id, x, y) for a given fixture path with ladderize=FALSE.
    failure_modes:
      - R/ggtree convention drift across Bioconductor releases not
        caught by version pin.
      - CSV column ordering changes silently; pytest reads by name.

  - id: treescape-ladderize-order
    title: Ladderization tip order matches ete3 with a documented tie-break
    case: cases/treescape.md
    source: treescape-core
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#oracle-comparison
    claim: >
      Tip order after ladderize() matches ete3's order exactly on
      fixtures where the documented tie-break rule is unambiguous.
      On topologies where multiple valid orderings exist, the claim
      degrades to topology-equivalent ordering and the exact tie-break
      treescape implements is recorded.
    evidence:
      oracle:
        - ete3 (pinned)
      tolerance: Exact tip-order equality where tie-break is unambiguous.
      command: pytest tests/oracle/test_ladderize_order.py -v
      artifact: tests/oracle/reports/ladderize_order.json
    assumptions:
      - Documented tie-break in docs/conventions.md is part of the claim.
    failure_modes:
      - Subtle stable-sort difference between Rust slice::sort_by and
        ete3's Python sorted() on equal-key elements.

  - id: treescape-svg-determinism
    title: SVG output is byte-identical for fixed input and options
    case: cases/treescape.md
    source: treescape-render
    tier: ci
    trust_strategy:
      - proof
      - validation
    pattern: evident/patterns/README.md#property-based-testing
    claim: >
      For a fixed tree and a fixed options struct, render_svg() produces
      byte-identical output across runs and platforms. Sorted attribute
      emission, fixed float formatting (e.g. "{:.6}"), no timestamps,
      no HashMap iteration order leakage.
    evidence:
      oracle:
        - self (snapshot golden SVGs checked into tests/fixtures/golden/)
      tolerance: Byte-exact equality.
      command: pytest tests/oracle/test_svg_determinism.py -v
      artifact: tests/oracle/reports/svg_determinism.json
    assumptions:
      - All randomness in the render path is seeded or eliminated.
      - Float formatting locale-independent.
    failure_modes:
      - HashMap iteration order leaks into attribute order.
      - Float formatting "{:.}" differs across platforms or locales.
      - A library dependency injects a timestamp or version comment
        into the SVG.

  - id: treescape-text-width-vs-fontdue
    title: Rust tip-label widths via fontdue agree with Python reference within 0.5 px
    case: cases/treescape.md
    source: treescape-render
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#reference-shadowing
    claim: >
      treescape-render's tip-label widths (computed by summing
      fontdue advance widths of the bundled DejaVu Sans at the
      configured font size) agree with the Python reference's widths
      (computed by reading the HMTX advance widths of the same TTF via
      fontTools) within 0.5 px absolute on a representative string
      battery: empty, single ASCII glyph (narrow `i`, wide `W`),
      mixed-case ASCII, Latin-1 with accents, embedded spaces,
      strings up to 64 chars. v0.2 supersedes the 0.6-em monospace
      approximation that v0.1 shipped; this claim pins the new
      behavior so the next external review can verify it.
    evidence:
      oracle:
        - treescape-reference (pure-Python, this workspace)
      tolerance: 0.5 px absolute on (sum of advance widths) per string.
      command: pytest tests/oracle/test_text_width.py -v
      artifact: tests/oracle/reports/text_width.json
    assumptions:
      - Both sides read the bundled treescape-render/src/fonts/DejaVuSans.ttf
        at compile time / load time. No system font fallback.
      - Latin-only, no shaping (no kerning, no ligatures, no BiDi). v0.2
        scope is rectangular phylogenetic trees with ASCII/Latin-1 tip
        names; downstream support lands when needed.
      - Pinned fontTools and fontdue versions recorded in env files.
    failure_modes:
      - Different font file shipped for Rust vs Python (e.g. font path
        mismatch in CI), which would diverge widths despite both impls
        being correct.
      - HMTX vs rasterized advance differing because of subpixel
        rounding inside fontdue; tolerance accommodates ≤ 0.5 px
        per-glyph drift summed over the string.

  - id: treescape-circular-layout-vs-ete3
    title: Circular layout agrees with ete3 (mode "c") within 1e-4 on (r, θ)
    case: cases/treescape.md
    source: treescape-core
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#oracle-comparison
    claim: >
      treescape's circular layout — radius and angle per node — agrees
      with ete3's circular-mode coordinates (`TreeStyle(mode="c")`)
      within 1e-4 absolute on `(r, θ)` per tip on small and medium
      fixtures, after the convention adjustments documented in
      `docs/conventions.md`. ete3 may use a different start angle
      (typically west / 9 o'clock) and/or sweep direction; the test
      applies the documented transforms before comparing — same pattern
      the rectangular Biopython oracle uses for its 1-based offset.
    evidence:
      oracle:
        - ete3 (pinned)
      tolerance: >
        1e-4 absolute on (r, θ) per tip after documented convention
        transforms. Looser than rectangular's 1e-6 because ete3's
        circular renderer rounds intermediate angles to floats during
        layout.
      command: pytest tests/oracle/test_circular_layout_vs_ete3.py -v
      artifact: tests/oracle/reports/circular_layout_vs_ete3.json
    assumptions:
      - ete3's coordinate output is read from its layout module, not
        from rendered pixel positions.
      - First end-to-end run of this claim will surface convention
        divergences (start angle, sweep direction, ladderize default).
        Each is documented in docs/conventions.md before any tolerance
        is touched. This is the same discipline that surfaced
        ggtree's default ladderize during v0.1.
    failure_modes:
      - ete3 silently changes its mode="c" defaults across versions;
        oracle catches this only via the version pin.
      - Convention adjustment is overfitted to one fixture's quirk
        rather than a general transform.

  - id: treescape-circular-layout-vs-ggtree
    title: Circular layout agrees with R/ggtree (layout="circular") within 1e-3 on (r, θ)
    case: cases/treescape.md
    source: treescape-core
    tier: release
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#oracle-comparison
    claim: >
      treescape's circular layout — radius and angle per node — agrees
      with `ggtree(tree, layout="circular")` coordinates within 1e-3
      absolute on `(r, θ)` per tip on small and medium fixtures, after
      the convention adjustments documented in `docs/conventions.md`.
      Tier release because it requires R + Bioconductor; runs inside
      `workflow/Dockerfile.evident-release` before any release tag.
    evidence:
      oracle:
        - R 4.x + Bioconductor + ggtree (pinned)
      tolerance: >
        1e-3 absolute on (r, θ) per tip after documented convention
        transforms. Looser than rectangular ggtree's 1e-4 because
        ggtree's circular layout adds an extra normalization step
        (angle scaling to fit ggplot2's polar coord) that introduces
        additional float drift.
      command: pytest tests/oracle/test_circular_layout_vs_ggtree.py -v -m release_only
      artifact: tests/oracle/reports/circular_layout_vs_ggtree.json
    assumptions:
      - R + Bioconductor + ggtree are available in the release runner.
      - workflow/scripts/oracle_ggtree.R supports a `--circular` flag
        (Phase 2 deliverable) that emits ggtree's circular coordinates
        with `ladderize = FALSE`.
    failure_modes:
      - ggtree's circular coordinate output normalizes radius to
        [0, 1] internally; oracle test must un-normalize before
        comparing.
      - Convention adjustment misses an asymmetric reorder (the
        ladderize trap from v0.1 ggtree, but applied to angles).

  - id: treescape-styling-determinism
    title: Same styled input produces byte-identical SVG across runs
    case: cases/treescape.md
    source: treescape-render
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#property-based-testing
    claim: >
      For any tree + scene options + style configuration, repeated
      renders produce byte-identical SVG. Style metadata is encoded
      into the scene graph via Rect (rectangular highlights),
      AnnularSector (circular highlights, v0.3 Phase 3), and
      per-Text / per-Line color overrides; ordering and serialization
      are deterministic. Extends treescape-svg-determinism
      (rectangular and circular layouts) to the styled-render path
      that v0.2 Phase 3 added rectangular and that v0.3 Phase 3
      extended to circular highlights. Additional property for the
      circular path: an AnnularSector's [theta_min, theta_max] equals
      the min/max layout tip angles in the clade (the polar analogue
      of the rectangular "row span equals clade tip rows" property).
      Rectangular and circular highlight shapes are NOT claimed
      equivalent under the polar transform — each layout is
      byte-deterministic in its own conventions, no cross-shape
      parity.
    evidence:
      oracle:
        - self (repeated render + golden snapshot + Rust↔Python ref byte parity)
      tolerance: >
        Exact byte equality across five repeated renders. Golden
        snapshots checked into tests/fixtures/golden/<fixture>_styled.svg
        (rectangular) and tests/fixtures/golden/<fixture>_styled_circular.svg
        (circular). Rust↔reference byte parity on the same fixtures.
      command: pytest tests/oracle/test_styling_determinism.py -v
      artifact: tests/oracle/reports/styling_determinism.json
    assumptions:
      - Style configuration is pure data (no callables, no random
        defaults); user-supplied colors are normalized into the same
        Color value across runs.
      - Circular highlight bounds use the layout's own r_max +
        label_zone outer radius (per docs/conventions.md, v0.3 Phase 3).
        A clade whose MRCA is the root raises ValueError rather than
        emitting a whole-canvas sector — this is part of the claim,
        tested explicitly.
    failure_modes:
      - Iteration over a Python dict / Rust HashMap leaks order into
        the scene-item list (currently the impls iterate user-ordered
        lists, but a future refactor could regress).
      - User passes a style spec that resolves to a different Color
        across runs (e.g. callable, time-dependent), which would
        rightly fail this claim.
      - Annular sector SVG path's float formatting drifts between
        Rust and Python (different rounding rules); the same _fmt_f
        convention used by Arc keeps these aligned, but a refactor
        of either could regress without a Rust↔ref byte-parity test
        catching it.

  - id: treescape-metadata-join-roundtrip
    title: join_metadata round-trips polars frames against the tree's tip universe
    case: cases/treescape.md
    source: packages/treescape-reference
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#oracle-comparison
    claim: >
      `TreePlot.join_metadata(df, on=...)` round-trips a polars DataFrame
      against the tree's tip universe under the conventions documented in
      `docs/conventions.md` (treescape conventions v0.3, metadata join):
      (a) every tip in the tree, after join, is queryable via
      `_metadata_for(tip_name)` and returns the same row data the user
      passed in (column dtypes preserved as Python scalars); (b) tips with
      no matching row in the frame return None for every column;
      (c) extra rows (rows whose `on=` value is not a tip in the tree)
      raise ValueError listing the unmatched count and first 5 names;
      (d) duplicate `on=` values in the frame raise ValueError listing the
      duplicated values; (e) chained join_metadata calls add columns,
      column-name collisions raise ValueError; (f) the empty frame is
      legal and produces all-None metadata for every tip with no warning.
      v0.3 is Python-only — no Rust port — so this claim compares the
      TreePlot implementation against the readable Python reference
      (`treescape_reference.metadata.join_metadata`) plus explicit
      failure-mode tests.
    evidence:
      oracle:
        - self (round-trip + explicit raise/no-raise on each rule)
      tolerance: Exact equality on row data per tip.
      command: pytest tests/oracle/test_metadata_join.py -v
      artifact: tests/oracle/reports/metadata_join.json
    assumptions:
      - Polars >= 1.0 (pinned in treescape-reference deps); column
        dtypes preserved across frame storage are polars's native dtypes.
        Round-trip equality checks compare via Python scalars after
        `_metadata_for` lookup, not polars `Series` equality.
      - Synthetic test fixtures at tests/fixtures/metadata/<tree_id>.csv
        cover both monophyletic-by-column and paraphyletic-by-column
        subtree shapes — the latter sets up Phase 2's branch-coloring
        claim.
      - The v0.3 storage scope (Python-side, no FFI) is the convention
        owner; revisiting the columnar-FFI variant in v0.4+ would extend
        this claim to a Rust↔Python parity claim. v0.3 does not.
    failure_modes:
      - Silent overwrite on chained-join column collision masks user
        error — which frame's column won. The explicit-raise rule
        guards against this.
      - The "tips with no row → all-None" rule is implemented as "row
        absent" but the frame may contain a row with all-None values
        for that tip; a passing test would not distinguish those, but
        downstream coloring code treats them identically. Documented
        and accepted.
      - The extra-rows-raise rule has a subtle false-negative — a row
        whose `on=` value matches a tip name but is wrong semantically
        (typo that happens to alias another tip) silently joins. No
        defense against semantic typos, only structural ones.

  - id: treescape-color-tips-by-discrete-roundtrip
    title: Discrete metadata tip coloring matches explicit tip color maps
    case: cases/treescape.md
    source: packages/treescape
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#oracle-comparison
    claim: >
      For a joined categorical metadata column, `TreePlot.color_tips_by`
      resolves to the same per-tip color mapping as an explicit
      `TreePlot.color_tips({...})` call using the same palette. The
      default palette is deterministic Tableau-10 ordered by first
      occurrence in tree tip order, so repeated renders are byte
      identical for the same tree + metadata.
    evidence:
      oracle:
        - self (explicit color_tips equivalence)
      tolerance: Exact SVG byte equality against the explicit mapping.
      command: pytest tests/oracle/test_color_tips_by_metadata.py -v
      artifact: tests/oracle/reports/color_tips_by_metadata.json
    assumptions:
      - Metadata has already passed the `join_metadata` validation
        contract; this claim tests color resolution only.
      - Only discrete/categorical columns are in scope. Continuous
        numeric color maps are covered by a later v0.3 claim.
    failure_modes:
      - Palette assignment accidentally depends on Python dict/set
        iteration order instead of tree tip order, making default
        colors nondeterministic.
      - Missing metadata values are colored as a category instead of
        leaving the tip at the default label color.

  - id: treescape-color-branches-by-monophyly
    title: Discrete metadata branch coloring respects monophyletic clades
    case: cases/treescape.md
    source: packages/treescape
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#property-based-testing
    claim: >
      For each rectangular internal branch and discrete metadata column,
      `TreePlot.color_branches_by(column)` colors the branch iff every
      descendant tip in the child subtree has the same non-None metadata
      value. Mixed or missing values leave the branch at the default
      stroke color and emit `TreescapeStyleWarning` naming the branch and
      column. Branch color overrides are serialized through the existing
      deterministic styled SVG path.
    evidence:
      oracle:
        - self (monophyly resolver + SVG serialization checks)
      tolerance: Exact warning/no-warning behavior and exact SVG color fragments.
      command: pytest tests/oracle/test_color_branches_by_metadata.py -v
      artifact: tests/oracle/reports/color_branches_by_metadata.json
    assumptions:
      - >
        v0.3 colors internal branches only: the horizontal segment from
        parent to child internal node. Terminal branch coloring is out
        of scope.
      - Discrete/categorical metadata only. Continuous gradients are a
        separate v0.3 claim.
    failure_modes:
      - Paraphyletic metadata silently colors an internal branch by the
        first/last descendant tip instead of warning and leaving default.
      - Missing metadata values are mistaken for a category and colored.

  - id: treescape-color-by-continuous-determinism
    title: Continuous metadata coloring produces byte-identical SVG for fixed inputs
    case: cases/treescape.md
    source: packages/treescape
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#property-based-testing
    claim: >
      `TreePlot.color_tips_by(column, cmap=...)` and
      `TreePlot.color_branches_by(column, cmap=...)` produce byte-identical
      SVG across repeated renders given the same column values, the same
      `cmap`, and the same `(vmin, vmax)` range. Default `cmap` is
      `"viridis"`, mapped through treescape's pinned 11-keystop LUT
      (documented in docs/conventions.md, v0.3 continuous color); endpoints
      are `#440154` at t=0 and `#fde725` at t=1. Callable `cmap` arguments
      are honored. Branch coloring uses the **mean** of descendant tips'
      non-missing values; subtrees with no observed values keep the
      default branch color silently — no warning, since "no data" is not
      a paraphyletic miscoloring. Degenerate ranges (`vmin == vmax`, or
      all values equal) deterministically map to the colormap midpoint
      (`t = 0.5`) rather than dividing by zero.
    evidence:
      oracle:
        - self (repeated render + LUT-endpoint assertions + auto/explicit equivalence)
      tolerance: Exact byte equality across repeated renders for fixed inputs.
      command: pytest tests/oracle/test_color_by_continuous.py -v
      artifact: tests/oracle/reports/color_by_continuous.json
    assumptions:
      - The viridis LUT shipped in `packages/treescape/src/treescape/plot.py`
        is the convention owner. Visual fidelity to matplotlib's full
        256-stop viridis is approximate; byte-determinism is exact.
      - The vmin/vmax kwargs default to the column's observed min/max
        across the tree's tip universe — so branch and tip colorings
        share the same scale by construction when both call color_*_by
        on the same column without explicit pins.
      - Auto-detection of numeric vs discrete dispatch reads
        isinstance(v, (int, float)) on observed values (excluding
        bool); pl.read_csv typically produces float for numeric
        columns, which routes correctly.
    failure_modes:
      - User passes a callable `cmap` whose output is locale-dependent or
        otherwise non-deterministic; this would rightly fail the claim.
      - Auto-detection misclassifies a column whose values are all
        numeric strings (e.g., `"0.85"`); user fixes by casting before
        the join, or by passing `cmap=` / `palette=` explicitly.
      - The pinned LUT changes between treescape versions, breaking
        byte-determinism across version bumps. Documented and accepted
        — golden bytes regen on a LUT change.

  - id: treescape-tip-count-invariant
    title: Rendered tip glyphs equal input tip count; coordinates within canvas
    case: cases/treescape.md
    source: treescape-render
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/patterns/README.md#property-based-testing
    claim: >
      For any tree with N tips, the rendered scene graph contains
      exactly N tip glyphs and all rendered (x, y) coordinates lie
      within the declared canvas bounds. Property-style invariant
      checked across hypothesis-generated trees.
    evidence:
      oracle:
        - hypothesis-generated random trees
      tolerance: Exact equality on tip glyph count; <= and >= on bounds.
      command: pytest tests/oracle/test_invariants.py -v --hypothesis-profile=ci
      artifact: tests/oracle/reports/tip_count_invariant.json
    assumptions:
      - Hypothesis profile ci runs at least 200 examples.
    failure_modes:
      - Layout overflow on extreme aspect ratios silently clips tips,
        but a tip count check still passes because clipping happens in
        the renderer.
