      self-consistency: "0.5.0"
      treescape-reference: "0.5.0"
    tolerances:
      - metric: mismatch_count
        op: "=="
        value: 0
        prose: "Exact equality on row data per tip."
    evidence:
      oracle:
        - self-consistency
        - treescape-reference
      command: pytest tests/oracle/test_metadata_join.py -v
      artifact: tests/oracle/reports/metadata_join.json
    assumptions:
      - Polars >= 1.0 (pinned in treescape-reference deps); column
        dtypes preserved across frame storage are polars's native dtypes.
        Round-trip equality checks compare via Python scalars after
        `_metadata_for` lookup, not polars `Series` equality.
      - Synthetic test fixtures at tests/fixtures/metadata/<tree_id>.csv
        cover both monophyletic-by-column and paraphyletic-by-column
        subtree shapes — the latter sets up Phase 2's branch-coloring
        claim.
      - The v0.3 storage scope (Python-side, no FFI) is the convention
        owner; revisiting the columnar-FFI variant in v0.4+ would extend
        this claim to a Rust↔Python parity claim. v0.3 does not.
    failure_modes:
      - Silent overwrite on chained-join column collision masks user
        error — which frame's column won. The explicit-raise rule
        guards against this.
      - The "tips with no row → all-None" rule is implemented as "row
        absent" but the frame may contain a row with all-None values
        for that tip; a passing test would not distinguish those, but
        downstream coloring code treats them identically. Documented
        and accepted.
      - The extra-rows-raise rule has a subtle false-negative — a row
        whose `on=` value matches a tip name but is wrong semantically
        (typo that happens to alias another tip) silently joins. No
        defense against semantic typos, only structural ones.

