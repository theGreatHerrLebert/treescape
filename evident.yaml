  - id: treescape-nj-recovers-additive-trees
    title: Neighbor joining recovers the generating tree from exact tree distances
    case: cases/treescape.md
    source: treescape-core
    tier: ci
    trust_strategy:
      - validation
      - proof
    pattern: evident/docs/reference/patterns.md#property-based-testing
    claim: >
      For every binary tree with positive branch lengths in the layout-v2
      random corpus (the yule, pda and ladder shapes), the path-length
      (patristic) distance matrix is additive, and neighbor joining is
      guaranteed to recover that tree (Saitou and Nei 1987; Atteson
      1999). Both treescape implementations return the generating tree
      as an unrooted tree: the same split set exactly, and every edge
      length within 1e-9 absolute. This checks correctness against
      ground truth, independently of any oracle's implementation.
    subsystem: tree-building
    inputs:
      corpus: "distance-v1"
      n: 36
      class: synthetic
      corpus_sha: "sha256:b40c0736e13ad47f8d410c45e063299dfede712f3b5c30faf764caaf6ac3ef53"
    pinned_versions:
      treescape: "0.5.0"
      generating-tree: "0.5.0"
    tolerances:
      - metric: mismatch_count
        op: "=="
        value: 0
        prose: "Unrooted topology identical to the generating tree."
      - metric: absolute_error
        op: "<"
        value: 1.0e-9
        prose: "1e-9 absolute on every edge length against the generating tree."
    evidence:
      oracle:
        - generating-tree
      command: pytest tests/oracle/test_nj_additive.py -v
      artifact: tests/oracle/reports/nj_additive.json
    assumptions:
      - The generating trees are binary with strictly positive branch
        lengths, so the additive matrix determines a unique unrooted
        tree; the zeros and polytomy shapes are excluded for that reason.
    failure_modes:
      - Floating-point accumulation on large trees (up to 200 tips) makes
        recovered lengths drift past 1e-9; that would be reported, not
        absorbed.

  - id: treescape-tree-build-performance
    title: Tree building speed against scikit-bio, Biopython and SciPy (bounded ratios)
    kind: performance
    case: cases/treescape.md
    source: treescape-core
    tier: release
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#oracle-backed-release-gate
    claim: >
      On seeded matrices of 500, 1000 and 2000 taxa (path lengths of a
      seeded Yule tree, each pair scaled by 1 +/- 0.1), measured as the
      median of 5 single-threaded wall-clock runs including the hand-off
      from Python, and only after each contender's tree has been checked
      against treescape's: treescape's neighbor joining takes at most 5x
      the time of scikit-bio's nj and less time than Biopython's
      DistanceTreeConstructor.nj (timed up to 1000 taxa); treescape's
      UPGMA takes at most 5x the time of SciPy's average linkage. This is
      NOT a claim that treescape is faster than the optimized tools: it
      is exact O(n^3) neighbor joining with a pinned summation order, and
      scikit-bio and SciPy are faster. Measured ratios and the machine are
      published on the docs site (Performance page).
    subsystem: tree-building
    inputs:
      corpus: "bench-v1"
      n: 3
      class: synthetic
      corpus_sha: "sha256:0613dda53a1f79abdb14e725aa1d145284952c0bc5dcadccc77fde35c8abdefe"
    pinned_versions:
      treescape: "0.5.0"
      scikit-bio: "0.7.3"
      Biopython: "1.88"
      SciPy: "1.18.1"
    tolerances:
      - metric: time_ratio
        op: "<="
        value: 5.0
        prose: "treescape NJ time / scikit-bio nj time, at every size."
      - metric: time_ratio
        op: "<"
        value: 1.0
        prose: "treescape NJ time / Biopython nj time, at every size where Biopython was timed."
      - metric: time_ratio
        op: "<="
        value: 5.0
        prose: "treescape UPGMA time / SciPy average-linkage time, at every size."
    evidence:
      oracle:
        - scikit-bio
        - Biopython
        - SciPy
      command: pytest tests/oracle/test_tree_build_performance.py -v -m bench
      artifact: tests/oracle/reports/tree_build_performance.json
    assumptions:
      - Wall-clock ratios depend on the machine; the bounds leave headroom
        over the measured ratios (NJ 2.0-3.7x scikit-bio, UPGMA 2.4-3.7x
        SciPy on the reference machine) and are a regression guard, not a
        speed ranking.
      - Single-threaded (OMP_NUM_THREADS=1 and friends); multi-threaded
        BLAS would change scikit-bio's and SciPy's times, not correctness.
    failure_modes:
      - A shared or throttled CI runner inflates one side of a ratio;
        rerun on a quiet machine before treating a failure as a regression.
      - An optimization that changes a result is caught by the
        Rust<->reference and oracle claims, which run on every push.
