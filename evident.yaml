version: 0.1
project: treescape
# Structured fields follow docs/conventions.md, "EVIDENT manifest";
# tests/oracle/test_manifest.py checks pins and corpus hashes.
vocabularies:
  subsystem: [parser, layout, text-metrics, render, style, metadata, julia-binding, ffi, tree-building]
  oracle:
    - Biopython
    - ete3
    - ggtree
    - hypothesis
    - treescape-reference
    - golden-snapshots
    - self-consistency
    - treescape-python
    - julia-subprocess
    - scikit-bio
    - SciPy
    - ape
    - phangorn
    - generating-tree
  tolerance_metric: [mismatch_count, time_ratio]
claims:
  - id: treescape-newick-roundtrip
    title: Newick parser round-trips and matches Biopython on canonical fixtures
    case: cases/treescape.md
    source: treescape-core
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#oracle-comparison
    claim: >
      The treescape Newick parser and writer round-trip every canonical
      fixture (parse -> write -> reparse) with exact equality on topology
      hash and branch lengths. On the small and medium fixture sets, the
      parsed tree agrees with Biopython.Phylo within 1e-9 on branch
      lengths and exactly on topology.
    subsystem: parser
    inputs:
      corpus: "newick-canonical-8"
      n: 8
      class: fixture
      corpus_sha: "sha256:75a1797f9ac8c3c50d4892b1d87fd45abab595488c5d98c0c2cf9748d51a9722"
    pinned_versions:
      treescape: "0.5.0"
      Biopython: "1.88"
      self-consistency: "0.5.0"
    tolerances:
      - metric: mismatch_count
        op: "=="
        value: 0
        prose: "Round-trip: exact equality on topology hash and branch lengths."
      - metric: absolute_error
        op: "<"
        value: 1.0e-09
        prose: "Biopython parity: 1e-9 absolute on branch lengths, exact on topology, on small/* and medium/* fixtures. Edge fixtures are excluded with a documented reason."
    evidence:
      oracle:
        - Biopython
        - self-consistency
      command: pytest tests/oracle/test_newick_roundtrip.py -v
      artifact: tests/oracle/reports/newick_roundtrip.json
    assumptions:
      - Biopython parses negative branch lengths and NHX comments with
        conventions that may differ from ours; those edge fixtures are
        excluded and documented in tests/fixtures/trees/FIXTURES.md.
      - Pinned Biopython version recorded in the test environment.
    failure_modes:
      - Round-trip silently normalizes formatting, masking parser bugs.
      - Quoted names with embedded parentheses parsed as structure.
      - NHX annotations dropped on write without a warning.

  - id: treescape-layout-rust-vs-reference
    title: Rust rectangular and circular layouts agree with the Python reference within 1e-9
    case: cases/treescape.md
    source: treescape-core
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#reference-shadowing
    claim: >
      Layout coordinates produced by treescape-core, rectangular (x, y)
      and circular (r, θ), agree with the readable Python reference in
      treescape-reference within 1e-9 absolute on every node of every
      tree in the layout-v2 corpus (the small and edge layout fixtures,
      the medium primates fixture, and 60 pinned random trees from 3 to
      200 tips with multifurcations, zero-length branches and ladders;
      scripts/gen_random_trees.py). This proves Rust<->Python parity,
      NOT correctness in absolute terms; correctness comes from the
      external-oracle claims, which check both implementations.
    subsystem: layout
    inputs:
      corpus: "layout-v2"
      n: 66
      class: fixture
      corpus_sha: "sha256:9d790ad3e3daa307bc745e7223873881632c566499b4e09d038ef3e5418b1b68"
    pinned_versions:
      treescape: "0.5.0"
      treescape-reference: "0.5.0"
    tolerances:
      - metric: absolute_error
        op: "<"
        value: 1.0e-09
        prose: "1e-9 absolute on (x, y) and on (r, θ) per node."
    evidence:
      oracle:
        - treescape-reference
      command: pytest tests/oracle/test_layout_vs_reference.py -v
      artifact: tests/oracle/reports/layout_rust_vs_reference.json
    assumptions:
      - The Python reference is the canonical convention owner; if its
        conventions are wrong, this claim still passes. Hence the five
        external-oracle layout claims (ete3, Biopython and ggtree
        rectangular; ete3 and ggtree circular).
      - Nodes are matched by clade (the set of tip names below them);
        corpus tip names are unique.
    failure_modes:
      - Both implementations drift in lockstep because they share an
        author and a fixture set (the closest local Agreement Trap).
      - Rust impl computes correctly but FFI string handling reorders
        children, producing identical structure with permuted indices.

  - id: treescape-layout-vs-ete3
    title: Rectangular layout agrees with ete3 within 1e-6 (CSIC lineage oracle)
    case: cases/treescape.md
    source: treescape-core
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#oracle-comparison
    claim: >
      Rectangular layout coordinates from both treescape implementations
      (the Rust core via treescape_connector, and treescape-reference)
      agree with ete3 within 1e-6 absolute on the layout-v2 corpus (the
      small and edge layout fixtures, the medium primates fixture, and
      60 pinned random trees from 3 to 200 tips with multifurcations,
      zero-length branches and ladders; scripts/gen_random_trees.py): x
      of every node against ete3's root distance (get_distance), and y
      of every tip against its index in ete3's leaf order (iter_leaves).
      ete3 has no internal-y rule, so internal y is not compared here.
      Conventions: docs/conventions.md.
    subsystem: layout
    inputs:
      corpus: "layout-v2"
      n: 66
      class: fixture
      corpus_sha: "sha256:9d790ad3e3daa307bc745e7223873881632c566499b4e09d038ef3e5418b1b68"
    pinned_versions:
      treescape: "0.5.0"
      ete3: "3.1.3"
    tolerances:
      - metric: absolute_error
        op: "<"
        value: 1.0e-06
        prose: "1e-6 absolute on x (every node) and y (tips)."
    evidence:
      oracle:
        - ete3
      command: pytest tests/oracle/test_layout_vs_ete3.py -v
      artifact: tests/oracle/reports/layout_vs_ete3.json
    assumptions:
      - ete3 coordinates are derived from its tree primitives
        (get_distance, iter_leaves); ete3's Qt renderer is not
        exercised.
      - The ete3 version is pinned in pinned_versions and checked
        against the installed package by tests/oracle/test_manifest.py.
      - Nodes are matched by clade (the set of tip names below them);
        corpus tip names are unique.
    failure_modes:
      - Ete3 changes its tip-ordering convention in a minor release and
        we silently bump the tolerance.
      - Fixture chosen because it happens to match, hiding a systematic
        gap on harder topologies.

  - id: treescape-layout-vs-biopython
    title: Rectangular layout agrees with Biopython.Phylo within 1e-6 (Biopython lineage oracle)
    case: cases/treescape.md
    source: treescape-core
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#oracle-comparison
    claim: >
      Rectangular layout coordinates from both treescape implementations
      (the Rust core via treescape_connector, and treescape-reference)
      agree with the x/y positions computed by Biopython.Phylo's own
      get_x_positions / get_y_positions (executed from the installed
      Biopython source) within 1e-6 absolute on the layout-v2 corpus
      (the small and edge layout fixtures, the medium primates fixture,
      and 60 pinned random trees from 3 to 200 tips with
      multifurcations, zero-length branches and ladders;
      scripts/gen_random_trees.py): x of every node, y of every tip
      (after Biopython's 1-based offset), and y of every internal node
      whose whole subtree is binary. At a multifurcation Biopython places
      the node at the midpoint of its first and last child and treescape
      at the mean of all children, and the difference propagates to every
      ancestor; that documented gap is excluded, not tolerated. This
      oracle is independent of ete3: different parser, different
      traversal, different coordinate construction.
    subsystem: layout
    inputs:
      corpus: "layout-v2"
      n: 66
      class: fixture
      corpus_sha: "sha256:9d790ad3e3daa307bc745e7223873881632c566499b4e09d038ef3e5418b1b68"
    pinned_versions:
      treescape: "0.5.0"
      Biopython: "1.88"
    tolerances:
      - metric: absolute_error
        op: "<"
        value: 1.0e-06
        prose: "1e-6 absolute on (x, y) per compared node."
    evidence:
      oracle:
        - Biopython
      command: pytest tests/oracle/test_layout_vs_biopython.py -v
      artifact: tests/oracle/reports/layout_vs_biopython.json
    assumptions:
      - Biopython's get_x_positions / get_y_positions are inner functions
        of Bio.Phylo._utils.draw, not public API; the runner executes the
        installed source, and the Biopython version is pinned and checked
        by tests/oracle/test_manifest.py.
      - Independence from ete3 holds because the two libraries derive
        from different code lineages with no shared layout heritage.
      - Nodes are matched by clade (the set of tip names below them);
        corpus tip names are unique.
    failure_modes:
      - Biopython's underscore-prefixed positions API breaks across a
        version bump and we paper over with a workaround instead of
        surfacing the regression.

  - id: treescape-layout-vs-ggtree
    title: Rectangular layout agrees with R/ggtree within 1e-4 (ggplot2 lineage oracle)
    case: cases/treescape.md
    source: treescape-core
    tier: release
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#oracle-comparison
    claim: >
      Rectangular layout coordinates from both treescape implementations
      (the Rust core via treescape_connector, and treescape-reference)
      agree with R ggtree's x/y output within 1e-4 absolute on every
      node of the layout-v2 corpus (the small and edge layout fixtures,
      the medium primates fixture, and 60 pinned random trees from 3 to
      200 tips with multifurcations, zero-length branches and ladders;
      scripts/gen_random_trees.py), after two convention adjustments
      documented in docs/conventions.md: the oracle invokes ggtree with
      ladderize=FALSE (treescape does not ladderize implicitly), and the
      test applies a +1 offset to our y to match ggtree's 1-based tip
      indexing. Tier release because it requires R + Bioconductor; runs
      inside workflow/Dockerfile.evident-release before any release tag.
    subsystem: layout
    inputs:
      corpus: "layout-v2"
      n: 66
      class: fixture
      corpus_sha: "sha256:9d790ad3e3daa307bc745e7223873881632c566499b4e09d038ef3e5418b1b68"
    pinned_versions:
      treescape: "0.5.0"
      ggtree: "4.0.5 (Bioconductor 3.22, R 4.5.3)"
    tolerances:
      - metric: absolute_error
        op: "<"
        value: 1.0e-04
        prose: "1e-4 absolute on (x, y) per node. Looser than ete3/Biopython because ggplot's internal scaling introduces float drift not present in the other oracles."
    evidence:
      oracle:
        - ggtree
      command: pytest tests/oracle/test_layout_vs_ggtree.py -v -m release_only
      artifact: tests/oracle/reports/layout_vs_ggtree.json
    assumptions:
      - R + Bioconductor + ggtree are available in the release runner;
        pytest skips with a clear message otherwise.
      - workflow/scripts/oracle_ggtree.R emits a deterministic CSV of
        (node, parent, x, y, is_tip, label) for a given fixture path
        with ladderize=FALSE.
      - Nodes are matched by clade (the set of tip names below them);
        corpus tip names are unique.
    failure_modes:
      - R/ggtree convention drift across Bioconductor releases not
        caught by version pin.
      - CSV column ordering changes silently; pytest reads by name.

  - id: treescape-ladderize-order
    title: Ladderization tip order matches ete3 with a documented tie-break
    case: cases/treescape.md
    source: treescape-core
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#oracle-comparison
    claim: >
      Tip order after ladderize() matches ete3's order exactly on
      fixtures where the documented tie-break rule is unambiguous.
      On topologies where multiple valid orderings exist, the claim
      degrades to topology-equivalent ordering and the exact tie-break
      treescape implements is recorded.
    subsystem: layout
    inputs:
      corpus: "layout-core-4"
      n: 4
      class: fixture
      corpus_sha: "sha256:dd4f5618a9082417a69b6d62f6971c1468d9101354434bdd828d20c414d3a3ee"
    pinned_versions:
      treescape: "0.5.0"
      ete3: "3.1.3"
    tolerances:
      - metric: mismatch_count
        op: "=="
        value: 0
        prose: "Exact tip-order equality where tie-break is unambiguous."
    evidence:
      oracle:
        - ete3
      command: pytest tests/oracle/test_ladderize_order.py -v
      artifact: tests/oracle/reports/ladderize_order.json
    assumptions:
      - Documented tie-break in docs/conventions.md is part of the claim.
    failure_modes:
      - Subtle stable-sort difference between Rust slice::sort_by and
        ete3's Python sorted() on equal-key elements.

  - id: treescape-svg-determinism
    title: SVG output is byte-identical for fixed input and options
    case: cases/treescape.md
    source: treescape-render
    tier: ci
    trust_strategy:
      - proof
      - validation
    pattern: evident/docs/reference/patterns.md#property-based-testing
    claim: >
      For a fixed tree and a fixed options struct, render_svg() produces
      byte-identical output across runs and platforms. Sorted attribute
      emission, fixed float formatting (e.g. "{:.6}"), no timestamps,
      no HashMap iteration order leakage.
    subsystem: render
    inputs:
      corpus: "layout-core-4"
      n: 4
      class: fixture
      corpus_sha: "sha256:dd4f5618a9082417a69b6d62f6971c1468d9101354434bdd828d20c414d3a3ee"
    pinned_versions:
      treescape: "0.5.0"
      golden-snapshots: "0.5.0"
      self-consistency: "0.5.0"
      treescape-reference: "0.5.0"
    tolerances:
      - metric: mismatch_count
        op: "=="
        value: 0
        prose: "Byte-exact equality."
    evidence:
      oracle:
        - golden-snapshots
        - self-consistency
        - treescape-reference
      command: pytest tests/oracle/test_svg_determinism.py -v
      artifact: tests/oracle/reports/svg_determinism.json
    assumptions:
      - All randomness in the render path is seeded or eliminated.
      - Float formatting locale-independent.
      - Platforms verified by CI (v0.6) - Linux x86-64 (ci-tier job) and
        macOS arm64 (determinism-macos job) run this runner against the
        same committed goldens.
    failure_modes:
      - HashMap iteration order leaks into attribute order.
      - Float formatting "{:.}" differs across platforms or locales.
      - A library dependency injects a timestamp or version comment
        into the SVG.

  - id: treescape-text-width-vs-fontdue
    title: Rust tip-label widths via fontdue agree with Python reference within 0.5 px
    case: cases/treescape.md
    source: treescape-render
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#reference-shadowing
    claim: >
      treescape-render's tip-label widths (computed by summing
      fontdue advance widths of the bundled DejaVu Sans at the
      configured font size) agree with the Python reference's widths
      (computed by reading the HMTX advance widths of the same TTF via
      fontTools) within 0.5 px absolute on a representative string
      battery: empty, single ASCII glyph (narrow `i`, wide `W`),
      mixed-case ASCII, Latin-1 with accents, embedded spaces,
      strings up to 64 chars. v0.2 supersedes the 0.6-em monospace
      approximation that v0.1 shipped; this claim pins the new
      behavior so the next external review can verify it.
    subsystem: text-metrics
    inputs:
      corpus: "tests/oracle/test_text_width.py"
      n: 70
      class: synthetic
    pinned_versions:
      treescape: "0.5.0"
      treescape-reference: "0.5.0"
    tolerances:
      - metric: absolute_error
        op: "<"
        value: 0.5
        prose: "0.5 px absolute on (sum of advance widths) per string."
    evidence:
      oracle:
        - treescape-reference
      command: pytest tests/oracle/test_text_width.py -v
      artifact: tests/oracle/reports/text_width.json
    assumptions:
      - Both sides read the bundled treescape-render/src/fonts/DejaVuSans.ttf
        at compile time / load time. No system font fallback.
      - Latin-only, no shaping (no kerning, no ligatures, no BiDi). v0.2
        scope is rectangular phylogenetic trees with ASCII/Latin-1 tip
        names; downstream support lands when needed.
      - Pinned fontTools and fontdue versions recorded in env files.
    failure_modes:
      - Different font file shipped for Rust vs Python (e.g. font path
        mismatch in CI), which would diverge widths despite both impls
        being correct.
      - HMTX vs rasterized advance differing because of subpixel
        rounding inside fontdue; tolerance accommodates ≤ 0.5 px
        per-glyph drift summed over the string.

  - id: treescape-circular-layout-vs-ete3
    title: Circular layout radii and tip order agree with ete3 (1e-4 on (r, θ))
    case: cases/treescape.md
    source: treescape-core
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#oracle-comparison
    claim: >
      Circular layout coordinates from both treescape implementations
      (the Rust core via treescape_connector, and treescape-reference)
      agree with ete3 within 1e-4 absolute on the layout-v2 corpus (the
      small and edge layout fixtures, the medium primates fixture, and
      60 pinned random trees from 3 to 200 tips with multifurcations,
      zero-length branches and ladders; scripts/gen_random_trees.py): r
      of every node against ete3's root distance, and θ of every tip
      against the angle treescape's documented formula assigns to that
      tip's index in ete3's leaf order. ete3 does not expose its
      circular-mode coordinates, so this checks radii and tip order, not
      the angle rule itself; the angle rule is checked against ggtree
      (release tier) and by Rust<->reference parity.
    subsystem: layout
    inputs:
      corpus: "layout-v2"
      n: 66
      class: fixture
      corpus_sha: "sha256:9d790ad3e3daa307bc745e7223873881632c566499b4e09d038ef3e5418b1b68"
    pinned_versions:
      treescape: "0.5.0"
      ete3: "3.1.3"
    tolerances:
      - metric: absolute_error
        op: "<"
        value: 1.0e-04
        prose: "1e-4 absolute on r (every node) and θ (tips). The runner asserts 1e-6; the claim keeps its original 1e-4 bound pending a decision (CHANGELOG)."
    evidence:
      oracle:
        - ete3
      command: pytest tests/oracle/test_circular_layout_vs_ete3.py -v
      artifact: tests/oracle/reports/circular_layout_vs_ete3.json
    assumptions:
      - ete3 coordinates are derived from its tree primitives
        (get_distance, iter_leaves); ete3's circular renderer is not
        exercised.
      - Nodes are matched by clade (the set of tip names below them);
        corpus tip names are unique.
    failure_modes:
      - ete3 silently changes its mode="c" defaults across versions;
        oracle catches this only via the version pin.
      - Convention adjustment is overfitted to one fixture's quirk
        rather than a general transform.

  - id: treescape-circular-layout-vs-ggtree
    title: Circular layout agrees with R/ggtree (layout="circular") within 1e-3 on (r, θ)
    case: cases/treescape.md
    source: treescape-core
    tier: release
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#oracle-comparison
    claim: >
      Circular layout coordinates from both treescape implementations
      (the Rust core via treescape_connector, and treescape-reference)
      agree with ggtree(tree, layout="circular", ladderize=FALSE) within
      1e-3 absolute on the layout-v2 corpus (the small and edge layout
      fixtures, the medium primates fixture, and 60 pinned random trees
      from 3 to 200 tips with multifurcations, zero-length branches and
      ladders; scripts/gen_random_trees.py): r of every node and θ of
      every tip, after the angle transform documented in
      docs/conventions.md (disagreement log). Internal θ is not
      compared: ggtree takes the linear mean of child angles, treescape
      the wrap-aware vector mean. Tier release because it requires R +
      Bioconductor; runs inside workflow/Dockerfile.evident-release
      before any release tag.
    subsystem: layout
    inputs:
      corpus: "layout-v2"
      n: 66
      class: fixture
      corpus_sha: "sha256:9d790ad3e3daa307bc745e7223873881632c566499b4e09d038ef3e5418b1b68"
    pinned_versions:
      treescape: "0.5.0"
      ggtree: "4.0.5 (Bioconductor 3.22, R 4.5.3)"
    tolerances:
      - metric: absolute_error
        op: "<"
        value: 0.001
        prose: "1e-3 absolute on r (every node) and θ (tips) after the documented transform. Looser than rectangular ggtree's 1e-4 because ggtree's circular layout adds an angle normalization step that introduces additional float drift."
    evidence:
      oracle:
        - ggtree
      command: pytest tests/oracle/test_circular_layout_vs_ggtree.py -v -m release_only
      artifact: tests/oracle/reports/circular_layout_vs_ggtree.json
    assumptions:
      - R + Bioconductor + ggtree are available in the release runner.
      - workflow/scripts/oracle_ggtree.R --circular emits ggtree's
        circular coordinates (node, parent, r, θ) with ladderize=FALSE.
      - Nodes are matched by clade (the set of tip names below them);
        corpus tip names are unique.
    failure_modes:
      - ggtree changes how its circular data frame reports radius (raw
        branch-length units today) and the r comparison fails for a
        reason other than a layout difference.
      - Convention adjustment misses an asymmetric reorder (the
        ladderize trap from v0.1 ggtree, but applied to angles).

  - id: treescape-styling-determinism
    title: Same styled input produces byte-identical SVG across runs
    case: cases/treescape.md
    source: treescape-render
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#property-based-testing
    claim: >
      For any tree + scene options + style configuration, repeated
      renders produce byte-identical SVG. Style metadata is encoded
      into the scene graph via Rect (rectangular highlights),
      AnnularSector (circular highlights, v0.3 Phase 3), and
      per-Text / per-Line color overrides; ordering and serialization
      are deterministic. Extends treescape-svg-determinism
      (rectangular and circular layouts) to the styled-render path
      that v0.2 Phase 3 added rectangular and that v0.3 Phase 3
      extended to circular highlights. Additional property for the
      circular path: an AnnularSector's [theta_min, theta_max] equals
      the min/max layout tip angles in the clade (the polar analogue
      of the rectangular "row span equals clade tip rows" property).
      Rectangular and circular highlight shapes are NOT claimed
      equivalent under the polar transform — each layout is
      byte-deterministic in its own conventions, no cross-shape
      parity.
    subsystem: render
    inputs:
      corpus: "layout-core-4"
      n: 4
      class: fixture
      corpus_sha: "sha256:dd4f5618a9082417a69b6d62f6971c1468d9101354434bdd828d20c414d3a3ee"
    pinned_versions:
      treescape: "0.5.0"
      self-consistency: "0.5.0"
      golden-snapshots: "0.5.0"
      treescape-reference: "0.5.0"
    tolerances:
      - metric: mismatch_count
        op: "=="
        value: 0
        prose: "Exact byte equality across five repeated renders. Golden snapshots checked into tests/fixtures/golden/<fixture>_styled.svg (rectangular) and tests/fixtures/golden/<fixture>_styled_circular.svg (circular). Rust↔reference byte parity on the same fixtures."
      - metric: absolute_error
        op: "<"
        value: 1.0e-12
        prose: "Circular highlight sectors: angular bounds equal the clade's extreme tip angles within 1e-12 rad."
    evidence:
      oracle:
        - self-consistency
        - golden-snapshots
        - treescape-reference
      command: pytest tests/oracle/test_styling_determinism.py -v
      artifact: tests/oracle/reports/styling_determinism.json
    assumptions:
      - Style configuration is pure data (no callables, no random
        defaults); user-supplied colors are normalized into the same
        Color value across runs.
      - Circular highlight bounds use the layout's own r_max +
        label_zone outer radius (per docs/conventions.md, v0.3 Phase 3).
        A clade whose MRCA is the root raises ValueError rather than
        emitting a whole-canvas sector — this is part of the claim,
        tested explicitly.
    failure_modes:
      - Iteration over a Python dict / Rust HashMap leaks order into
        the scene-item list (currently the impls iterate user-ordered
        lists, but a future refactor could regress).
      - User passes a style spec that resolves to a different Color
        across runs (e.g. callable, time-dependent), which would
        rightly fail this claim.
      - Annular sector SVG path's float formatting drifts between
        Rust and Python (different rounding rules); the same _fmt_f
