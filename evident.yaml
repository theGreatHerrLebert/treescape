        catching it.

  - id: treescape-metadata-join-roundtrip
    title: join_metadata round-trips polars frames against the tree's tip universe
    case: cases/treescape.md
    source: packages/treescape-reference
    tier: ci
    trust_strategy:
      - validation
    pattern: evident/docs/reference/patterns.md#oracle-comparison
    claim: >
      `TreePlot.join_metadata(df, on=...)` round-trips a polars DataFrame
      against the tree's tip universe under the conventions documented in
      `docs/conventions.md` (treescape conventions v0.3, metadata join):
      (a) every tip in the tree, after join, is queryable via
      `_metadata_for(tip_name)` and returns the same row data the user
      passed in (column dtypes preserved as Python scalars); (b) tips with
      no matching row in the frame return None for every column;
      (c) extra rows (rows whose `on=` value is not a tip in the tree)
      raise ValueError listing the unmatched count and first 5 names;
      (d) duplicate `on=` values in the frame raise ValueError listing the
      duplicated values; (e) chained join_metadata calls add columns,
      column-name collisions raise ValueError; (f) the empty frame is
      legal and produces all-None metadata for every tip with no warning.
      v0.3 is Python-only — no Rust port — so this claim compares the
      TreePlot implementation against the readable Python reference
      (`treescape_reference.metadata.join_metadata`) plus explicit
      failure-mode tests.
    subsystem: metadata
    inputs:
      corpus: "metadata-small-3"
      n: 3
      classes: [fixture, synthetic]
