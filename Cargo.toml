[workspace]
members = [
    "treescape-core",
    "treescape-render",
    "treescape-connector",
    "treescape-jl-connector",
]
# The EVIDENT submodule carries its own crate (typed-trust, the manifest
# validator and claim-viewer generator); keep it out of this workspace.
exclude = ["evident"]

resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/theGreatHerrLebert/treescape"

[profile.release]
debug = true
overflow-checks = true
lto = "thin"
panic = "abort"
