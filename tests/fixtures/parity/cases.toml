# Parity cases for claim treescape-julia-python-svg-parity.
#
# Data only: each case names a tree source and a chain of TreePlot
# operations. tests/oracle/test_julia_parity.py interprets it for the
# Python package and packages/Treescape.jl/test/parity_runner.jl for
# Treescape.jl; the SVG bytes must match. TOML because both languages
# parse it with their standard library.
#
# ops: {op = "<method>", args = [...], kwargs = {...}}. Method names are
# Python's (`color_tips_by`); Julia calls the `!` form. Colors given as
# arrays are tuples. `join_metadata` takes a table name from [tables].
# `expect_file`, when set, is a committed SVG both hosts must also match.

[trees]
primates = { path = "tests/fixtures/trees/medium/primates.nwk" }
support = { newick = "((a:0.1,b:0.2)95:0.3,(c:0.15,(d:0.05,e:0.07)70:0.1)88:0.2);" }
multi = { newick = "((a:1,b:1,c:1):1,(d:1,:1):2,e:0.5);" }
# Trees built from distance matrices (v0.6 Phase 3).
textbook_nj = { distances = "tests/fixtures/distances/ties_textbook_5.tsv", method = "nj" }
gaps_k2p_nj = { sequences = "tests/fixtures/alignments/gaps_and_ambiguity.fasta", model = "k2p", method = "nj" }
protein_poisson_upgma = { sequences = "tests/fixtures/alignments/protein.fasta", model = "poisson", method = "upgma" }
doubtful_protein_nj = { sequences = "tests/fixtures/alignments/doubtful_protein.fasta", model = "jc69", alphabet = "protein", method = "nj" }
textbook_upgma = { distances = "tests/fixtures/distances/ties_textbook_5.tsv", method = "upgma" }
zeros_upgma = { distances = "tests/fixtures/distances/ties_zero_pairs_6.tsv", method = "upgma" }

[tables.primates]
tip = ["Homo_sapiens", "Pan_troglodytes", "Gorilla_gorilla", "Pongo_abelii", "Hylobates_lar", "Macaca_mulatta", "Papio_anubis", "Cercopithecus_mitis", "Chlorocebus_sabaeus", "Callithrix_jacchus", "Saimiri_sciureus"]
clade = ["great_apes", "great_apes", "great_apes", "great_apes", "lesser_apes", "old_world_monkeys", "old_world_monkeys", "old_world_monkeys", "old_world_monkeys", "new_world_monkeys", "new_world_monkeys"]
support = [0.99, 0.97, 0.95, 0.91, 0.88, 0.93, 0.92, 0.85, 0.83, 0.78, 0.75]

# Tips missing from the table get missing values.
[tables.primates_partial]
tip = ["Homo_sapiens", "Pan_troglodytes", "Macaca_mulatta", "Papio_anubis", "Callithrix_jacchus"]
group = ["ape", "ape", "monkey", "monkey", "monkey"]
score = [3.5, 2.25, 1.0, 0.5, 4.0]

[tables.support]
tip = ["a", "b", "c", "d", "e"]
grp = ["x", "x", "y", "y", "y"]
count = [1, 5, 2, 8, 3]
weight = [0.1, 0.9, 0.4, 0.4, 0.7]

[tables.multi]
tip = ["a", "b", "c", "d"]
kind = ["p", "p", "p", "q"]
value = [1.0, 2.0, 4.0, 8.0]

