# Named input corpora for evident.yaml claims (`inputs.corpus`).
#
# `inputs.corpus_sha` in the manifest is scripts/corpus_sha.py over the
# files listed here; tests/oracle/test_manifest.py recomputes it. Paths are
# relative to the repository root. Adding a file to a corpus changes its
# hash, which is intended: the manifest then records the new corpus.

[corpora.layout-core-4]
description = "Small layout fixtures shared by the layout, ladderize and determinism claims"
files = [
  "tests/fixtures/trees/small/two_tip.nwk",
  "tests/fixtures/trees/small/balanced_4.nwk",
  "tests/fixtures/trees/small/unbalanced_5.nwk",
  "tests/fixtures/trees/edge/trifurcation_root.nwk",
]

[corpora.newick-canonical-8]
description = "Canonical Newick fixtures for the parser claim (edge fixtures included)"
files = [
  "tests/fixtures/trees/small/two_tip.nwk",
  "tests/fixtures/trees/small/balanced_4.nwk",
  "tests/fixtures/trees/small/unbalanced_5.nwk",
  "tests/fixtures/trees/medium/primates.nwk",
  "tests/fixtures/trees/edge/quoted_names.nwk",
  "tests/fixtures/trees/edge/trifurcation_root.nwk",
  "tests/fixtures/trees/edge/neg_branches.nwk",
  "tests/fixtures/trees/edge/nhx_comments.nwk",
]

[corpora.metadata-small-3]
