# Named input corpora for evident.yaml claims (`inputs.corpus`).
#
# `inputs.corpus_sha` in the manifest is scripts/corpus_sha.py over the
# files listed here; tests/oracle/test_manifest.py recomputes it. Paths are
# relative to the repository root. Adding a file to a corpus changes its
# hash, which is intended: the manifest then records the new corpus.

