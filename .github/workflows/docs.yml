name: docs

# Builds the MkDocs site (docs/ + mkdocs.yml; scripts/mkdocs_hooks.py
# copies the gallery and generates the claims page) and publishes it to
# GitHub Pages. Requires Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        # MkDocs 2.0 drops the plugin/hook system this site uses; stay on 1.x.
        run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10" PyYAML
      - name: Build (strict)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    # Publish from main only; pull requests just check that the site builds.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
