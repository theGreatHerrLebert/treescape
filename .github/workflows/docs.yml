name: docs

# Builds the MkDocs site (docs/ + mkdocs.yml; scripts/mkdocs_hooks.py
# copies the gallery, generates the claims page and renders the typed-trust
# claim viewer into /trust/) and publishes it to
# GitHub Pages. Requires Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # evident/ (typed-trust); not recursive, see ci.yml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: evident/typed-trust
      - name: Build typed-trust (EVIDENT claim viewer)
        run: cargo build --release --manifest-path evident/typed-trust/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      - name: Build (strict)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    # Publish from main only; pull requests just check that the site builds.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job may write to Pages, and only deploys share the
    # queue, so a pull-request build can never cancel a pending deploy.
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
