name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual run on main: the only way to run the release tier *before*
  # pushing a tag (Actions → ci → Run workflow).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"

jobs:
  rust-test:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `true`, not `recursive`: the `evident` submodule has nested
          # case-study submodules (`cases/cu-ims-primitives`,
          # `cases/proteon`) that are private/unrelated to treescape's
          # validation. Recursing fails CI on missing/private deps.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
        continue-on-error: true   # advisory until lint debt is paid down

  ci-tier-claims:
    name: ci-tier oracle claims
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # see rust-test job for why not recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            evident/typed-trust -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # Oracle versions are pinned to evident.yaml's pinned_versions
          # (tests/oracle/test_manifest.py checks); same file as the
          # release image.
          pip install maturin -r tests/requirements-oracles.txt
      - name: Build & install connector
        # `pip install -e` invokes maturin via PEP 517, which doesn't
        # require an active venv (unlike `maturin develop`). The
        # actions/setup-python runner Python is the install target.
        run: pip install -e ./treescape-connector
      - name: Install Python packages
        run: |
          pip install -e packages/treescape-reference
          pip install -e packages/treescape
      - name: Validate manifest (upstream EVIDENT schema)
        run: python evident/workflow/validate_manifest.py --strict-release-pins evident.yaml
      - name: Translate manifest (typed-trust)
        run: |
          cargo build --release --manifest-path evident/typed-trust/Cargo.toml
          evident/typed-trust/target/release/typed-trust evident.yaml > /dev/null
      - name: Run ci-tier oracle claims
        run: pytest tests/oracle -v -m "not release_only"
      - name: Upload oracle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-reports-ci
          path: tests/oracle/reports/

  julia:
    name: Julia binding (Julia ${{ matrix.julia }})
    runs-on: ubuntu-latest
    needs: rust-test
    strategy:
      fail-fast: false
      matrix:
        julia: ["1.10", "1.12"]   # compat floor + development version
    env:
      TREESCAPE_JULIA: julia
      # Julia claims fail rather than skip if a prerequisite is missing.
      TREESCAPE_REQUIRE_JULIA: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # see rust-test job for why not recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build C-ABI connector
        run: cargo build -p treescape-jl-connector --release
      - name: Treescape.jl unit tests
        run: julia --project=packages/Treescape.jl -e 'using Pkg; Pkg.test()'
      - name: Install Python side (parity reference)
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-oracles.txt
          pip install -e ./treescape-connector
          pip install -e packages/treescape-reference -e packages/treescape
      - name: Julia claims (parity + docs examples + FFI no-abort)
        run: pytest tests/oracle/test_julia_parity.py tests/oracle/test_docs_examples.py tests/oracle/test_jl_ffi_no_abort.py -v
      - name: Upload oracle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-reports-julia-${{ matrix.julia }}
          path: tests/oracle/reports/

  miri:
    name: Miri (C-ABI connector)
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: Run connector tests under Miri
        run: cargo miri test -p treescape-jl-connector

  release-tier-claims:
    name: release-tier oracle claims (ggtree)
    runs-on: ubuntu-latest
    needs: ci-tier-claims
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # see rust-test job for why not recursive
      - name: Build release-tier image
        run: docker build -f workflow/Dockerfile.evident-release -t treescape-release .
      - name: Run release-tier claim runner
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace treescape-release \
            bash -lc "(cd treescape-connector && maturin develop --release) && \
                       pip install -e packages/treescape-reference -e packages/treescape && \
                       pytest tests/oracle -v -m release_only"
