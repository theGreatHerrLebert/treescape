[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treescape-reference"
version = "0.1.0"
description = "Slow, readable pure-Python reference implementations that serve as the EVIDENT oracles for treescape's Rust core."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "David Teschner", email = "davidteschner@googlemail.com" },
]
dependencies = [
    "fonttools>=4.50",
    "polars>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "biopython>=1.84",
    "ete3>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/treescape_reference"]

[tool.hatch.build.targets.wheel.force-include]
"src/treescape_reference/fonts/DejaVuSans.ttf" = "treescape_reference/fonts/DejaVuSans.ttf"
"src/treescape_reference/fonts/LICENSE.DejaVu.txt" = "treescape_reference/fonts/LICENSE.DejaVu.txt"
